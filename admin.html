<!DOCTYPE html>
<html>
<head>
  <title>Panel Admin</title>

  <!-- Fuente PRO -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    .header {
      background: #020617;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      border-bottom: 2px solid #FFD700;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #020617;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border-left: 5px solid #FFD700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .codigo {
      font-size: 18px;
      color: #FFD700;
      font-weight: bold;
    }

    .usado {
      color: red;
    }

    .activo {
      color: #22c55e;
    }
  </style>
</head>

<body>

<div class="header">
  🎟️ PANEL ADMIN CUPONES
</div>

<div class="container" id="lista">
  Cargando...
</div>

<script>
async function cargar() {
  const res = await fetch("/admin-data");
  const data = await res.json();

  let html = "";

  data.forEach(c => {
    html += `
      <div class="card">
        <div>
          <div class="codigo">${c.codigo}</div>
          <div>${c.telefono || ""}</div>
        </div>

        <div class="${c.usado ? 'usado' : 'activo'}">
          ${c.usado ? 'USADO' : 'DISPONIBLE'}
        </div>
      </div>
    `;
  });

  document.getElementById("lista").innerHTML = html;
}

cargar();
</script>

</body>
</html>
